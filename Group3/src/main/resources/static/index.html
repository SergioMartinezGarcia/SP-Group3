<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Search & Topic Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        .btn-danger:hover {
            background: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .topics-list h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.2rem;
        }

        .topic-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .topic-item:hover {
            background: #f5f5f5;
        }

        .topic-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .topic-id {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .topic-words {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .admin-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .admin-section h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1rem;
        }

        .admin-button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .results-container {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-count {
            font-size: 1.1rem;
            color: #666;
        }

        .clear-filter {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .document-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .document-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .doc-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .doc-url {
            color: #667eea;
            text-decoration: none;
            margin-bottom: 15px;
            display: block;
            font-size: 0.9rem;
        }

        .doc-url:hover {
            text-decoration: underline;
        }

        .doc-content {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .doc-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topic-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .topic-weight {
            background: rgba(255,255,255,0.3);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1rem;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #c00;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            border: 2px solid #cfc;
            border-radius: 8px;
            padding: 15px;
            color: #060;
            margin-bottom: 20px;
        }

        .ingestion-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .ingestion-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .filter-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Document Search & Topic Explorer</h1>
            <p class="subtitle">Powered by Elasticsearch & Mallet Topic Modeling</p>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="topics-list">
                    <h3>📊 Topics</h3>
                    <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">
                        Click to filter searches and crawling
                    </p>
                    <div id="topicsList">
                        <div class="loading">Loading topics...</div>
                    </div>
                </div>

                <div class="admin-section">
                    <h3>⚙️ Admin Actions</h3>
                    <div class="admin-button-group">
                        <button class="btn btn-secondary btn-sm" onclick="reindexDocuments()">
                            🔄 Reindex & Train
                        </button>
                        
                        <button class="btn btn-danger btn-sm" onclick="deleteAllData()">
                            🗑️ Delete All Data
                        </button>
                        
                        <button class="btn btn-danger btn-sm" onclick="deleteDocuments()">
                            📄 Delete Documents
                        </button>
                        
                        <button class="btn btn-danger btn-sm" onclick="deleteTopics()">
                            📊 Delete Topics
                        </button>
                    </div>
                    
                    <h3 style="margin-top: 15px;">
                        📥 Ingest Documents
                        <span id="crawlFilterBadge"></span>
                    </h3>
                    <div class="ingestion-form">
                        <input type="text" id="topicInput" class="ingestion-input" placeholder="Topic (e.g., science)" value="science">
                        <button class="btn btn-secondary btn-sm" onclick="ingestDocuments()">
                            📥 Crawl
                        </button>
                    </div>
                    <p style="font-size: 0.75rem; color: #999; margin-top: 5px;">
                        Crawled docs will be filtered by selected topic (if any)
                    </p>
                </div>
            </aside>

            <!-- Main Search Section -->
            <main class="search-section">
                <div id="messageContainer"></div>

                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Search documents (e.g., climate change, technology, politics)..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="btn btn-primary" onclick="searchDocuments()">
                        🔍 Search
                    </button>
                </div>

                <div class="results-container" id="resultsContainer">
                    <div style="text-align: center; padding: 60px; color: #999;">
                        <p style="font-size: 1.2rem;">Enter a search query to find documents</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api';
        let currentTopicFilter = null;
        let currentQuery = '';

        // Load topics on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTopics();
        });

        // Handle Enter key in search
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchDocuments();
            }
        }

        // Load all topics
        async function loadTopics() {
            try {
                const response = await fetch(`${API_BASE}/gateway/topics`);
                const topics = await response.json();
                
                const topicsContainer = document.getElementById('topicsList');
                
                if (topics.length === 0) {
                    topicsContainer.innerHTML = '<p style="color: #999;">No topics available. Run reindex first.</p>';
                    return;
                }

                topicsContainer.innerHTML = topics.map(topic => `
                    <div class="topic-item" onclick="filterByTopic(${topic.id})">
                        <div class="topic-id">Topic ${topic.id}</div>
                        <div class="topic-words">${topic.topWords.slice(0, 5).join(', ')}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading topics:', error);
                document.getElementById('topicsList').innerHTML = '<p style="color: #c00;">Failed to load topics</p>';
            }
        }

        // Filter by topic (affects both search and crawling)
        function filterByTopic(topicId) {
            if (currentTopicFilter === topicId) {
                currentTopicFilter = null;
                document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
                updateFilterBadge();
            } else {
                currentTopicFilter = topicId;
                document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
                event.target.closest('.topic-item').classList.add('active');
                updateFilterBadge();
            }
            
            if (currentQuery) {
                searchDocuments();
            }
        }

        // Update filter badge
        function updateFilterBadge() {
            const badge = document.getElementById('crawlFilterBadge');
            if (currentTopicFilter !== null) {
                badge.innerHTML = `<span class="filter-badge">Topic ${currentTopicFilter}</span>`;
            } else {
                badge.innerHTML = '';
            }
        }

        // Search documents
        async function searchDocuments() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showMessage('Please enter a search query', 'error');
                return;
            }

            currentQuery = query;
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                let url = `${API_BASE}/gateway/search?query=${encodeURIComponent(query)}`;
                if (currentTopicFilter !== null) {
                    url += `&topicFilter=${currentTopicFilter}`;
                }

                const response = await fetch(url);
                const data = await response.json();
                
                displayResults(data);
            } catch (error) {
                console.error('Error searching:', error);
                resultsContainer.innerHTML = '<div class="error">Failed to search documents. Make sure the server is running.</div>';
            }
        }

        // Display search results
        function displayResults(data) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (data.hits.length === 0) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <p style="font-size: 1.2rem;">No results found for "${data.query}"</p>
                        <p>Try a different search term or remove topic filters</p>
                    </div>
                `;
                return;
            }

            const filterInfo = currentTopicFilter !== null 
                ? `<span class="clear-filter" onclick="clearTopicFilter()">Clear topic filter</span>`
                : '';

            resultsContainer.innerHTML = `
                <div class="results-header">
                    <div class="results-count">
                        Found <strong>${data.hits.length}</strong> result(s) for "<strong>${data.query}</strong>"
                        ${currentTopicFilter !== null ? `<span class="filter-badge">Topic ${currentTopicFilter}</span>` : ''}
                    </div>
                    ${filterInfo}
                </div>
                ${data.hits.map(doc => createDocumentCard(doc)).join('')}
            `;
        }

        // Create document card HTML
        function createDocumentCard(doc) {
            const topicsHtml = doc.topics && Object.values(doc.topics).length > 0
                ? Object.values(doc.topics)
                    .sort((a, b) => b.weight - a.weight)
                    .map(topic => `
                        <div class="topic-badge" title="${topic.topWords.join(', ')}">
                            Topic ${topic.id}
                            <span class="topic-weight">${(topic.weight * 100).toFixed(0)}%</span>
                        </div>
                    `).join('')
                : '<span style="color: #999; font-size: 0.9rem;">No topics assigned</span>';

            return `
                <div class="document-card">
                    <h2 class="doc-title">${doc.metadata?.webTitle || doc.id}</h2>
                    ${doc.url ? `<a href="${doc.url}" target="_blank" class="doc-url">${doc.url}</a>` : ''}
                    <p class="doc-content">${doc.content ? doc.content.substring(0, 300) + '...' : 'No content available'}</p>
                    <div class="doc-topics">${topicsHtml}</div>
                </div>
            `;
        }

        // Clear topic filter
        function clearTopicFilter() {
            currentTopicFilter = null;
            document.querySelectorAll('.topic-item').forEach(item => item.classList.remove('active'));
            updateFilterBadge();
            searchDocuments();
        }

        // Reindex documents
        async function reindexDocuments() {
            if (!confirm('This will reindex all documents and retrain the topic model. This may take several minutes. Continue?')) {
                return;
            }

            showMessage('Reindexing started... This may take several minutes.', 'success');

            try {
                const response = await fetch(`${API_BASE}/admin/reindex`, {
                    method: 'POST'
                });
                
                const message = await response.text();
                
                if (response.ok) {
                    showMessage('Reindexing completed successfully!', 'success');
                    loadTopics(); // Reload topics
                } else {
                    showMessage('Reindexing failed: ' + message, 'error');
                }
            } catch (error) {
                console.error('Error reindexing:', error);
                showMessage('Failed to reindex documents', 'error');
            }
        }

        // Delete all data (documents + topics)
        async function deleteAllData() {
            if (!confirm('⚠️ WARNING: This will permanently delete ALL documents and topics from MongoDB. This action cannot be undone. Continue?')) {
                return;
            }

            showMessage('Deleting all data...', 'success');

            try {
                const response = await fetch(`${API_BASE}/admin/all`, {
                    method: 'DELETE'
                });
                
                const message = await response.text();
                
                if (response.ok) {
                    showMessage(message, 'success');
                    loadTopics();
                    currentTopicFilter = null;
                    updateFilterBadge();
                    document.getElementById('resultsContainer').innerHTML = `
                        <div style="text-align: center; padding: 60px; color: #999;">
                            <p style="font-size: 1.2rem;">All data has been deleted</p>
                        </div>
                    `;
                } else {
                    showMessage('Delete failed: ' + message, 'error');
                }
            } catch (error) {
                console.error('Error deleting data:', error);
                showMessage('Failed to delete data', 'error');
            }
        }

        // Delete only documents
        async function deleteDocuments() {
            if (!confirm('⚠️ This will permanently delete ALL documents from MongoDB. Continue?')) {
                return;
            }

            showMessage('Deleting documents...', 'success');

            try {
                const response = await fetch(`${API_BASE}/admin/documents`, {
                    method: 'DELETE'
                });
                
                const message = await response.text();
                
                if (response.ok) {
                    showMessage(message, 'success');
                    document.getElementById('resultsContainer').innerHTML = `
                        <div style="text-align: center; padding: 60px; color: #999;">
                            <p style="font-size: 1.2rem;">All documents have been deleted</p>
                        </div>
                    `;
                } else {
                    showMessage('Delete failed: ' + message, 'error');
                }
            } catch (error) {
                console.error('Error deleting documents:', error);
                showMessage('Failed to delete documents', 'error');
            }
        }

        // Delete only topics
        async function deleteTopics() {
            if (!confirm('⚠️ This will permanently delete ALL topics from MongoDB. Continue?')) {
                return;
            }

            showMessage('Deleting topics...', 'success');

            try {
                const response = await fetch(`${API_BASE}/admin/topics`, {
                    method: 'DELETE'
                });
                
                const message = await response.text();
                
                if (response.ok) {
                    showMessage(message, 'success');
                    loadTopics();
                    currentTopicFilter = null;
                    updateFilterBadge();
                } else {
                    showMessage('Delete failed: ' + message, 'error');
                }
            } catch (error) {
                console.error('Error deleting topics:', error);
                showMessage('Failed to delete topics', 'error');
            }
        }

        // Ingest documents (now respects topic filter)
        async function ingestDocuments() {
            const topic = document.getElementById('topicInput').value.trim();
            
            if (!topic) {
                showMessage('Please enter a topic', 'error');
                return;
            }

            // Build URL with optional topic filter
            let url = `${API_BASE}/trigger?topic=${encodeURIComponent(topic)}`;
            let message = `Crawling documents for topic: ${topic}`;
            
            if (currentTopicFilter !== null) {
                url += `&targetTopics=${currentTopicFilter}`;
                message += ` (filtering for Topic ${currentTopicFilter})`;
            }
            
            showMessage(message + '...', 'success');

            try {
                const response = await fetch(url, {
                    method: 'POST'
                });
                
                const responseMessage = await response.text();
                showMessage(responseMessage, 'success');
            } catch (error) {
                console.error('Error ingesting:', error);
                showMessage('Failed to ingest documents', 'error');
            }
        }

        // Show message
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            container.innerHTML = '';
            container.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
